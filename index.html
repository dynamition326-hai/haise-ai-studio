<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Haise AI SEO總部</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#081321;color:#eaf3ff;font:14px system-ui,sans-serif}.app{height:100vh;display:grid;grid-template:64px 1fr/1fr 310px}header{grid-column:1/3;display:flex;align-items:center;gap:12px;padding:0 20px;background:#0c1a29;border-bottom:1px solid #26394d}.logo{background:linear-gradient(135deg,#62dfbd,#68a6ff);color:#081321;padding:9px 12px;border-radius:10px;font-weight:900}.sub{color:#91a4bb;font-size:11px}.badge{border:1px solid #35506b;border-radius:20px;padding:4px 9px;color:#b6c9dc;font-size:11px}.scene{position:relative;min-height:0}canvas{width:100%;height:100%;display:block}.stats{position:absolute;top:14px;left:14px;display:flex;gap:8px}.stats span{background:#101e2dcc;border:1px solid #2a3c52;border-radius:10px;padding:7px;font-size:11px}.side{background:#0c1927;border-left:1px solid #26394d;padding:16px;overflow:auto}.side h2{font-size:14px}.person{width:100%;display:flex;align-items:center;gap:10px;text-align:left;color:#eaf3ff;background:#122235;border:1px solid #26394d;border-radius:12px;padding:9px;margin:6px 0;cursor:pointer}.person.sel{border-color:#65daba}.dot{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;color:#07111e;font-weight:bold}.role{color:#91a4bb;font-size:11px}.note{margin-top:15px;padding:10px;color:#dbc99b;background:#211e17;border:1px solid #483e2b;border-radius:10px;font-size:11px}.buttons{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:6px}.buttons button{background:#17283a;color:#eaf3ff;border:1px solid #35475d;border-radius:10px;padding:8px 12px;cursor:pointer}@media(max-width:700px){.app{height:100dvh;grid-template:56px 45vh 1fr/1fr}header{grid-column:1}.side{border:0;border-top:1px solid #26394d}.people{display:grid;grid-template-columns:1fr 1fr}.person{padding:7px}.buttons{bottom:8px}}
.activity{margin-top:16px;padding-top:12px;border-top:1px solid #26394d}.activity h3{font-size:12px;margin:0 0 9px}.activity-list{display:grid;gap:8px}.activity-item{display:grid;grid-template-columns:42px 1fr;gap:7px;color:#aabbd0;font-size:10px}.activity-time{color:#71859b}.buttons button.active{background:#2b4058;border-color:#65daba}.clock{margin-left:auto;color:#91a4bb;font-size:11px}
</style></head>
<body><div class="app"><header><span class="logo">H</span><div><b>Haise AI SEO總部</b><div class="sub">SEO Growth Team · 虛擬協作空間</div></div><span class="badge">演示模式</span><span class="clock">台北時間 <b id="clock">--:--</b></span></header><main class="scene"><canvas id="view"></canvas><div class="stats"><span>2 工作中</span><span>2 思考中</span><span>1 待命</span></div><div class="buttons"><button id="auto" class="active">◷ 台北時間自動</button><button id="day">☀ 白天</button><button id="night">☾ 夜晚</button><button id="reset">重設視角</button></div></main><aside class="side"><h2>團隊成員</h2><div class="people" id="people"></div><div id="detail"></div><section class="activity"><h3>最近活動 <span style="float:right;color:#72869b;font-weight:400">模擬紀錄</span></h3><div class="activity-list"><div class="activity-item"><span class="activity-time">現在</span><span><b>Scott</b> 正在研究關鍵字與搜尋結果</span></div><div class="activity-item"><span class="activity-time">稍早</span><span><b>Domo</b> 整理 SEO 策略優先順序</span></div><div class="activity-item"><span class="activity-time">稍早</span><span><b>Kevin</b> 檢查策略假設與風險</span></div><div class="activity-item"><span class="activity-time">稍早</span><span><b>Fiona</b> 等待技術稽核任務</span></div><div class="activity-item"><span class="activity-time">稍早</span><span><b>Zoey</b> 等待研究證據與內容需求</span></div></div></section><div class="note">演示版：成員狀態與活動為模擬資料，尚未連接各 bot 即時回報。</div></aside></div>
<script type="module">
import * as T from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const crew=[['Domo','SEO 策略負責人','#62dfbd','思考中'],['Scott','關鍵字研究員','#68a6ff','研究中'],['Fiona','技術 SEO 稽核員','#f2a45a','待命'],['Zoey','SEO 內容編輯','#c493ff','撰寫中'],['Kevin','SEO 魔鬼代言人','#ff7287','思考中']];
const root=document.querySelector('#people'),detail=document.querySelector('#detail');let picked=0;root.innerHTML=crew.map((p,i)=>`<button class="person ${i?'':'sel'}" data-i="${i}"><span class="dot" style="background:${p[2]}">${p[0][0]}</span><span><b>${p[0]}</b><div class="role">${p[1]} · ${p[3]}</div></span></button>`).join('');function select(i){picked=i;document.querySelectorAll('.person').forEach((b,j)=>b.classList.toggle('sel',i===j));detail.innerHTML=`<p><b>${crew[i][0]}</b>｜${crew[i][3]}</p><div class="role">此狀態為展示資料</div>`}root.onclick=e=>{let b=e.target.closest('.person');if(b)select(+b.dataset.i)};select(0);
const c=document.querySelector('#view'),r=new T.WebGLRenderer({canvas:c,antialias:true});r.setPixelRatio(Math.min(devicePixelRatio,2));r.shadowMap.enabled=true;const s=new T.Scene();s.background=new T.Color('#101d2c');const cam=new T.PerspectiveCamera(36,1,.1,100);cam.position.set(12,14,17);cam.lookAt(0,0,0);s.add(new T.HemisphereLight(0xb9dcff,0x443322,2));const sun=new T.DirectionalLight(0xffe2bd,3);sun.position.set(-5,12,8);sun.castShadow=true;s.add(sun);const mat=(color)=>new T.MeshStandardMaterial({color,roughness:.8});function box(w,h,d,color,x,y,z){let m=new T.Mesh(new T.BoxGeometry(w,h,d),mat(color));m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;s.add(m);return m}
box(16,.35,12,'#bd8a55',0,-.25,0);box(16,.5,.2,'#27374b',0,-.02,-6);box(16,.45,.2,'#27374b',0,2.82,-6);box(.2,3,12,'#27374b',-8,1.3,0);box(8,.06,5.5,'#293d53',0,-.04,0);const skyMat=new T.MeshBasicMaterial({color:'#8ac9f0'});const sky=new T.Mesh(new T.PlaneGeometry(16,3),skyMat);sky.position.set(0,1.55,-6.12);s.add(sky);for(let j=0;j<5;j++){let pane=new T.Mesh(new T.BoxGeometry(2.8,1.8,.035),new T.MeshBasicMaterial({color:'#c5edff',transparent:true,opacity:.1,depthWrite:false}));pane.position.set(-6+j*3,1.55,-5.84);pane.renderOrder=2;s.add(pane);if(j<4)box(.07,2,.1,'#27374b',-4.5+j*3,1.55,-5.72)}const moon=new T.Mesh(new T.SphereGeometry(.18,12,10),new T.MeshBasicMaterial({color:'#eef3ff'}));moon.position.set(-5.7,2.05,-6.05);s.add(moon);const stars=new T.Group();s.add(stars);for(let k=0;k<20;k++){let star=new T.Mesh(new T.SphereGeometry(.018,6,6),new T.MeshBasicMaterial({color:'#fff3c4'}));star.position.set(-7+(k*1.47%14),.8+(k*1.13%1.5),-6.04);stars.add(star)}const tx=3,tz=-6.02;for(let j=0;j<8;j++)box(.56-j*.03,.14,.22,j%2?'#358f78':'#43a68a',tx,.74+j*.15,tz);box(.1,.22,.1,'#62c3a5',tx,1.98,tz);box(.035,.16,.035,'#bce8d8',tx,2.18,tz);const zoneColors=['#314969','#7440a1','#337e61','#934b67','#8c682f'];for(let i=0;i<5;i++){let x=-5.4+(i%3)*5.4,z=i<3?-2.4:2.1;box(3,.05,2.6,zoneColors[i],x,-.04,z);box(2.2,.18,1.1,'#765139',x,1,z);box(.12,.9,.12,'#394655',x-.8,.5,z);box(.12,.9,.12,'#394655',x+.8,.5,z);box(.9,.6,.12,'#182432',x,1.4,z-.35);let screen=box(.75,.4,.03,crew[i][2],x,1.4,z-.27);screen.material.emissive=new T.Color(crew[i][2]);screen.material.emissiveIntensity=.5;box(.65,.15,.6,'#30445b',x,.55,z+1);let body=new T.Mesh(new T.CylinderGeometry(.28,.34,.75,8),mat(crew[i][2]));body.position.set(x,.55,z+1.75);body.castShadow=true;s.add(body);let head=new T.Mesh(new T.SphereGeometry(.25,12,10),mat('#efc29b'));head.position.set(x,1.1,z+1.75);s.add(head)}
let theta=.72,phi=.72,rad=24;function resize(){let b=c.getBoundingClientRect();r.setSize(b.width,b.height,false);cam.aspect=b.width/b.height;cam.updateProjectionMatrix()}new ResizeObserver(resize).observe(c);resize();let down=false,px=0,py=0;c.onpointerdown=e=>{down=true;px=e.clientX;py=e.clientY;c.setPointerCapture(e.pointerId)};c.onpointerup=()=>down=false;c.onpointermove=e=>{if(down){theta-=(e.clientX-px)*.008;phi=Math.max(.3,Math.min(1.25,phi+(e.clientY-py)*.006));px=e.clientX;py=e.clientY}};c.onwheel=e=>{rad=Math.max(17,Math.min(32,rad+e.deltaY*.015))};document.querySelector('#reset').onclick=()=>{theta=.72;phi=.72;rad=24};let sceneMode='Auto';function setSceneTime(mode){const hour=Number(new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Taipei',hour:'2-digit',hour12:false}).format(new Date()));const phase=mode==='Auto'?(hour>=6&&hour<17?'Day':hour>=17&&hour<19?'Dusk':'Night'):mode;const colors={Day:['#142638','#8ac9f0',3.5],Dusk:['#2b1d2b','#e79b79',1.7],Night:['#07111e','#183253',.7]}[phase];sceneMode=mode;s.background.set(colors[0]);skyMat.color.set(colors[1]);sun.intensity=colors[2];moon.visible=phase==='Night';stars.visible=phase==='Night';document.querySelectorAll('.buttons button').forEach(b=>b.classList.toggle('active',b.id.toLowerCase()===mode.toLowerCase()))}document.querySelector('#auto').onclick=()=>setSceneTime('Auto');document.querySelector('#day').onclick=()=>setSceneTime('Day');document.querySelector('#night').onclick=()=>setSceneTime('Night');setSceneTime('Auto');setInterval(()=>{if(sceneMode==='Auto')setSceneTime('Auto')},60000);const clockEl=document.querySelector('#clock');function updateClock(){clockEl.textContent=new Intl.DateTimeFormat('zh-TW',{timeZone:'Asia/Taipei',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date())}updateClock();setInterval(updateClock,1000);function draw(t){requestAnimationFrame(draw);cam.position.set(Math.sin(theta)*Math.cos(phi)*rad,Math.sin(phi)*rad,Math.cos(theta)*Math.cos(phi)*rad);cam.lookAt(0,.3,0);r.render(s,cam)}draw();
</script></body></html>
